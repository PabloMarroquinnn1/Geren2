[options]
admin_passwd = __ODOO_MASTER_PASSWORD__
data_dir = /var/lib/odoo
addons_path = /mnt/extra-addons,/mnt/extra-addons/oca-dms,/usr/lib/python3/dist-packages/odoo/addons
proxy_mode = True
dbfilter = ^quetzalmart$
list_db = False
workers = 2
