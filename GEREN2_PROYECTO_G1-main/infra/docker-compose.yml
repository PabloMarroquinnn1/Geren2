services:
  postgres:
    image: postgres:16-alpine
    container_name: quetzalmart-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - quetzalmart_internal

  odoo:
    image: odoo:18.0
    container_name: quetzalmart-odoo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      PORT: 5432
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons
    ports:
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    networks:
      - quetzalmart_internal

  mailpit:
    image: axllent/mailpit:latest
    container_name: quetzalmart-mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - quetzalmart_internal

volumes:
  postgres_data:
  odoo_data:
  mailpit_data:

networks:
  quetzalmart_internal:
    driver: bridge
